<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>News - Lutong Conservation Project</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ====== Global Styles ====== */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fff;
    }

    header {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    nav {
      background: #34495e;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      padding: 60px 20px;
      max-width: 1200px;
      margin: auto;
    }

    footer {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    /* ====== News Section ====== */
    #news {
      background:#f9f9f9;
      border-radius:8px;
      padding:60px 20px;
      margin-top:60px;
    }

    .news-header {
      text-align:center;
      margin-bottom:40px;
    }

    .news-header h1 {
      color:#2c3e50;
      margin-bottom:12px;
    }

    .news-header p {
      color:#555;
      max-width:800px;
      margin:0 auto;
      line-height:1.6;
    }

    .news-block {
      margin-bottom:40px;
      text-align:center;
    }

    .news-block h2 {
      color:#27ae60;
      margin-bottom:10px;
      text-align:left;
    }

    .news-block p {
      color:#555;
      text-align:left;
    }

    /* ====== Instagram Grid ====== */
    .ig-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: left;
    }

    .instagram-media {
      max-width: 150px !important; /* ukuran embed lebih kecil */
      flex: 1 1 300px;
      margin: auto;
    }

    /* ====== Responsive ====== */
    @media (max-width: 768px) {
      .news-block {
        margin-bottom:30px;
      }
      .instagram-media {
        max-width: 90% !important;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Our Publications</h1>
    <p>Explore our latest updates, research, and social media highlights.</p>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="programs.html">Programs</a>
    <a href="news.html">News</a>
    <a href="contact.html">Contact</a>
    <a href="lutong.html">Meet the Lutong</a>
  </nav>

  <!-- News Section -->
  <section id="news">
    <!-- News -->
    <div class="news-block">
      <h2>News</h2>
      <p>Coming Soon!</p>
    </div>

    <!-- Research Articles -->
    <div class="news-block">
      <h2>Research Articles</h2>
      <p>Coming Soon!</p>
    </div>

    <!-- Social Media -->
    <div class="news-block">
      <h2>Social Media</h2>
      <p>Follow our latest updates on Instagram:</p>

      <div class="ig-grid">
        <!-- Postingan 1 -->
        <blockquote class="instagram-media" 
            data-instgrm-permalink="https://www.instagram.com/p/Daev0ZzEhjD/" 
            data-instgrm-version="14"></blockquote>
      </div>

      <script async src="//www.instagram.com/embed.js"></script>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Lutong Conservation Project</p>
  </footer>

</body>
</html>
